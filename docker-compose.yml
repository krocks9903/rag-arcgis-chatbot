# Local Docker stack (free) — API + React frontend
#
# Usage:
#   1. Copy backend/.env.example → backend/.env and set GROQ_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:3000 (React UI)  API: http://localhost:8080
#   4. Admin: http://localhost:3000/admin.html
#
# First build downloads ML models and bakes the FAISS index (~15–25 min).
# Later builds use Docker layer cache.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rag-arcgis-chatbot:local
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # React is served by the web service; API stays JSON-only here.
      SERVE_FRONTEND: "false"
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
